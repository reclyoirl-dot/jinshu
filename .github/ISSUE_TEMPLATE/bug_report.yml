name: 🐞 问题反馈
description: 排版异常、粘贴到公众号后样式丢失、编辑器报错等
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 请描述问题，最好附上截图（编辑器预览 + 公众号后台的对比）
    validations:
      required: true
  - type: textarea
    id: markdown
    attributes:
      label: 能复现问题的 Markdown
      description: 贴出最小的一段内容即可
      render: markdown
  - type: dropdown
    id: where
    attributes:
      label: 出现在哪里
      options:
        - 编辑器预览
        - 粘贴到公众号后台（电脑）
        - 公众号文章（手机）
        - 其他
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: 例如 Chrome 130 / Windows 11
