name: 💡 功能建议
description: 希望锦书新增或改进的功能
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或场景
      description: 先讲场景，比直接讲方案更有帮助
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
